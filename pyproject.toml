[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cover-suite"
version = "1.18"
description = "Elite Cover Suite - draw the branded databook cover and hand it to Databook"
requires-python = ">=3.11"
authors = [{ name = "Tanzim Nasir" }]
license = { text = "LicenseRef-Proprietary" }
dependencies = ["pypdf>=4,<6", "reportlab>=4,<5", "Pillow>=10", "pymupdf>=1.24"]

[project.optional-dependencies]
build = ["pyinstaller>=6,<7"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
cover-suite = "cover_suite.gui:main"
cover-suite-gui = "cover_suite.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cover_suite = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
